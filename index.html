<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Concession System</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">🚆</div>
                <h1>Welcome Back</h1>
                <p>Login to College Concession portal</p>
            </div>

            <div class="role-toggle">
                <button class="role-btn active" id="btn-student" onclick="setRole('student')">Student</button>
                <button class="role-btn" id="btn-admin" onclick="setRole('admin')">Admin</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label id="username-label">Roll Number</label>
                    <input type="text" id="username" class="form-control" required placeholder="Enter roll number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-submit">
                    <span id="login-text">Sign In</span>
                </button>
            </form>
            
            <div style="margin-top:20px; text-align:center; font-size: 0.8rem; color:var(--text-muted)">
                Demo test accounts:<br>
                Student: 101 / student123<br>
                Admin: admin / admin123
            </div>
            
            <button id="theme-toggle" class="btn btn-outline btn-sm" style="position:fixed; top:1rem; right:1rem; border-radius: 50%;">🌙</button>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('btn-student').classList.remove('active');
            document.getElementById('btn-admin').classList.remove('active');
            document.getElementById(`btn-${role}`).classList.add('active');
            
            const label = document.getElementById('username-label');
            const input = document.getElementById('username');
            
            if (role === 'admin') {
                label.innerText = 'Admin ID';
                input.placeholder = 'Enter admin username';
            } else {
                label.innerText = 'Roll Number';
                input.placeholder = 'Enter roll number';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const submitBtnText = document.getElementById('login-text');
            submitBtnText.innerHTML = '<span class="spinner"></span> Signing In...';
            
            const res = await apiCall('/login', 'POST', { username, password, role: currentRole });
            
            submitBtnText.innerHTML = 'Sign In';
            
            if (res.success) {
                localStorage.setItem('user', JSON.stringify(res.user));
                showToast('Login successful!');
                window.location.href = res.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
            } else {
                showToast(res.message, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            setupThemeToggle();
            
            // Auto redirect if already logged in
            const userStr = localStorage.getItem('user');
            if(userStr) {
                const user = JSON.parse(userStr);
                window.location.href = user.role === 'admin' ? '/admin.html' : '/dashboard.html';
            }
        });
    </script>
</body>
</html>
