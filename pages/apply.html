<!DOCTYPE html>
<html>

<head>

<title>Apply Concession</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container mt-5">

<h2 class="text-primary mb-4">Apply for Railway Concession</h2>

<div class="card p-4 shadow">

<div class="mb-3">
<label>Name</label>
<input id="name" type="text" class="form-control">
</div>

<div class="mb-3">
<label>Roll Number</label>
<input id="roll" type="text" class="form-control">
</div>

<div class="mb-3">
<label>Branch</label>
<input id="branch" type="text" class="form-control">
</div>

<div class="mb-3">
<label>Semester</label>
<input id="semester" type="text" class="form-control">
</div>

<div class="mb-3">
<label>From Station</label>
<input id="from_station" type="text" class="form-control">
</div>

<div class="mb-3">
<label>To Station</label>
<input id="to_station" type="text" class="form-control">
</div>

<button onclick="submitApplication()" class="btn btn-success">
Submit Application
</button>

</div>

</div>

<script>

function submitApplication(){

const data = {

name: document.getElementById("name").value,
roll: document.getElementById("roll").value,
branch: document.getElementById("branch").value,
semester: document.getElementById("semester").value,
from_station: document.getElementById("from_station").value,
to_station: document.getElementById("to_station").value

};

fetch("/apply",{

method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)

})
.then(res=>res.json())
.then(response=>{

alert("Application submitted successfully!");

});

}

</script>

</body>

</html>
