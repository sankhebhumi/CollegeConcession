<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header" style="color: var(--primary);">
                🛡️ Admin Office
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    Applications
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border);">
                <button onclick="logout()" class="btn btn-outline btn-sm" style="width: 100%; justify-content: flex-start; gap: 0.5rem; color: var(--error);">
                    <svg style="width:18px; height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar glass">
                <div class="user-profile">
                    <div style="font-weight: 600; font-size: 1.1rem; color: var(--primary);" id="user-greeting">Administrator</div>
                </div>
                <div style="display:flex; gap:1rem; align-items:center">
                    <button id="theme-toggle" class="btn btn-outline btn-sm" style="width:40px; height:40px; border-radius:50%; padding:0; background:var(--surface-color); border:1px solid var(--glass-border)">🌙</button>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Application Management</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Review and process student railway concession requests.</p>
                </div>

                <div class="grid grid-cols-4" style="grid-template-columns: repeat(4, 1fr);">
                    <div class="stat-card glass">
                        <div class="stat-icon primary">📁</div>
                        <div class="stat-info">
                            <h3>Total</h3>
                            <p id="stat-total">--</p>
                        </div>
                    </div>
                    <div class="stat-card glass">
                        <div class="stat-icon warning">⏳</div>
                        <div class="stat-info">
                            <h3>Pending</h3>
                            <p id="stat-pending">--</p>
                        </div>
                    </div>
                    <div class="stat-card glass">
                        <div class="stat-icon success">✅</div>
                        <div class="stat-info">
                            <h3>Approved</h3>
                            <p id="stat-approved">--</p>
                        </div>
                    </div>
                    <div class="stat-card glass">
                        <div class="stat-icon" style="background:var(--error-bg);color:var(--error)">❌</div>
                        <div class="stat-info">
                            <h3>Rejected</h3>
                            <p id="stat-rejected">--</p>
                        </div>
                    </div>
                </div>

                <!-- Applications Table -->
                <div style="margin-top: 3rem;">
                    <h3 style="margin-bottom: 1.25rem; font-weight: 600;">Process Requests</h3>
                    <div class="table-container glass">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student Details</th>
                                    <th>Travel Route</th>
                                    <th>Submission</th>
                                    <th>Status</th>
                                    <th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="app-table-body">
                                <tr><td colspan="5" style="text-align:center;">Loading records...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Confirmation Modal -->
    <div class="qr-modal" id="confirmModal">
        <div class="qr-card" style="text-align: left;">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-text" style="color:var(--text-muted); font-size:0.875rem; margin-top: 0.5rem;"></p>
            
            <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary btn-sm" id="confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let currentAction = null;

        document.addEventListener('DOMContentLoaded', () => {
            setupThemeToggle();
            const user = checkAuth('admin');
            if(!user) return;
            
            document.getElementById('user-greeting').innerText = `Admin Office: ${user.username}`;
            loadData();
        });

        async function loadData() {
            const res = await apiCall('/admin/applications');
            if(res.success) {
                document.getElementById('stat-total').innerText = res.analytics.total;
                document.getElementById('stat-pending').innerText = res.analytics.pending;
                document.getElementById('stat-approved').innerText = res.analytics.approved;
                document.getElementById('stat-rejected').innerText = res.analytics.rejected;

                const tbody = document.getElementById('app-table-body');
                if(res.applications.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No completed applications yet.</td></tr>`;
                } else {
                    tbody.innerHTML = res.applications.map(app => {
                        let actionButtons = '-';
                        if(app.status === 'Pending') {
                            actionButtons = `
                                <div style="display:flex; gap:0.5rem">
                                    <button class="btn btn-success btn-sm" onclick="confirmAction(${app.id}, 'Approved', '${app.name}')">Approve</button>
                                    <button class="btn btn-danger btn-sm" onclick="confirmAction(${app.id}, 'Rejected', '${app.name}')">Reject</button>
                                </div>
                            `;
                        } else if(app.status === 'Approved') {
                            actionButtons = `<button class="btn btn-danger btn-sm" onclick="confirmAction(${app.id}, 'Rejected', '${app.name}')">Revoke</button>`;
                        }
                        
                        return `
                        <tr>
                            <td>
                                <div style="font-weight:600">${app.name}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted)">Roll: ${app.roll_no} | ${app.branch}</div>
                            </td>
                            <td>${app.from_station} ➔ ${app.to_station}</td>
                            <td>${new Date(app.date_applied).toLocaleDateString()}</td>
                            <td><span class="badge ${app.status.toLowerCase()}">${app.status}</span></td>
                            <td>${actionButtons}</td>
                        </tr>
                        `;
                    }).join('');
                }
            }
        }

        const modal = document.getElementById('confirmModal');
        
        function confirmAction(id, status, name) {
            currentAction = { id, status };
            document.getElementById('modal-title').innerText = `${status === 'Approved' ? 'Approve' : 'Reject'} Application`;
            document.getElementById('modal-text').innerText = `Are you sure you want to mark ${name}'s concession application as ${status}?`;
            
            const confirmBtn = document.getElementById('confirm-btn');
            confirmBtn.className = status === 'Approved' ? 'btn btn-success btn-sm' : 'btn btn-danger btn-sm';
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            currentAction = null;
        }

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            if(!currentAction) return;
            
            const btn = document.getElementById('confirm-btn');
            const originalText = btn.innerText;
            btn.innerHTML = `<span class="spinner"></span>`;
            
            const res = await apiCall(`/admin/applications/${currentAction.id}/status`, 'POST', {
                status: currentAction.status
            });
            
            if(res.success) {
                showToast(res.message);
                closeModal();
                loadData(); // reload table
            } else {
                showToast(res.message, 'error');
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
