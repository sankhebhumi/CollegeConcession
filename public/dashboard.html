<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                🚆 Concession
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    Dashboard
                </a>
                <a href="apply.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"></path></svg>
                    Apply Now
                </a>
                <a href="status.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Application Status
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border);">
                <button onclick="logout()" class="btn btn-outline btn-sm" style="width: 100%; justify-content: flex-start; gap: 0.5rem; color: var(--error);">
                    <svg style="width:18px; height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar glass">
                <div class="user-profile">
                    <div style="font-weight: 600; font-size: 1.1rem;" id="user-greeting">Welcome</div>
                </div>
                <div style="display:flex; gap:1rem; align-items:center">
                    <button id="theme-toggle" class="btn btn-outline btn-sm" style="width:40px; height:40px; border-radius:50%; padding:0; background:var(--surface-color); border:1px solid var(--glass-border)">🌙</button>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Student Overview</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Quick summary of your concession applications</p>
                </div>

                <div class="grid grid-cols-3">
                    <div class="stat-card glass">
                        <div class="stat-icon primary">📄</div>
                        <div class="stat-info">
                            <h3>Total Applications</h3>
                            <p id="stat-total">--</p>
                        </div>
                    </div>
                    
                    <div class="stat-card glass" style="cursor: pointer;" onclick="window.location.href='apply.html'">
                        <div class="stat-icon success" style="background: var(--primary-gradient); color: white;">+</div>
                        <div class="stat-info">
                            <h3 style="color:var(--text-main); font-weight:600; font-size:1rem; margin-top:0.3rem;">New Application</h3>
                            <p style="font-size:0.875rem; color:var(--text-muted); font-weight:400;">Apply for railway pass</p>
                        </div>
                    </div>
                </div>

                <!-- Recent applications preview -->
                <div style="margin-top: 3rem;">
                    <h3 style="margin-bottom: 1rem; font-weight: 600;">Recent Status</h3>
                    <div class="table-container glass">
                        <table>
                            <thead>
                                <tr>
                                    <th>Route</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-table-body">
                                <tr><td colspan="3" style="text-align:center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            setupThemeToggle();
            const user = checkAuth('student');
            if(!user) return;
            
            document.getElementById('user-greeting').innerText = `Hello, ${user.name} (${user.roll_no})`;
            
            // Load dashboard data
            const res = await apiCall(`/applications/${user.id}`);
            if(res.success && res.applications) {
                document.getElementById('stat-total').innerText = res.applications.length;
                
                const tableBody = document.getElementById('recent-table-body');
                if(res.applications.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">No applications found</td></tr>`;
                } else {
                    // Show top 3
                    const recent = res.applications.slice(0, 3);
                    tableBody.innerHTML = recent.map(app => `
                        <tr>
                            <td>${app.from_station} ➔ ${app.to_station}</td>
                            <td>${new Date(app.date_applied).toLocaleDateString()}</td>
                            <td><span class="badge ${app.status.toLowerCase()}">${app.status}</span></td>
                        </tr>
                    `).join('');
                }
            }
        });
    </script>
</body>
</html>
