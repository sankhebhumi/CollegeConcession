<!DOCTYPE html>
<html>

<head>

<title>Application Status</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container mt-5">

<h2 class="text-primary mb-4">Application Status</h2>

<div class="card p-4 shadow">

<table class="table">

<thead>

<tr>
<th>Name</th>
<th>Roll</th>
<th>Branch</th>
<th>Semester</th>
<th>From</th>
<th>To</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script>

fetch("/applications")
.then(res=>res.json())
.then(data=>{

let table="";

data.forEach(app=>{

table+=`
<tr>
<td>${app.name}</td>
<td>${app.roll}</td>
<td>${app.branch}</td>
<td>${app.semester}</td>
<td>${app.from_station}</td>
<td>${app.to_station}</td>
<td>${app.status || "Pending"}</td>
</tr>
`;

});

document.getElementById("tableBody").innerHTML=table;

});

</script>

</body>

</html>
