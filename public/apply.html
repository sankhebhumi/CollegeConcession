<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Concession</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                🚆 Concession
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    Dashboard
                </a>
                <a href="apply.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"></path></svg>
                    Apply Now
                </a>
                <a href="status.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Application Status
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border);">
                <button onclick="logout()" class="btn btn-outline btn-sm" style="width: 100%; justify-content: flex-start; gap: 0.5rem; color: var(--error);">
                    <svg style="width:18px; height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
                    Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar glass">
                <div class="user-profile">
                    <div style="font-weight: 600; font-size: 1.1rem;" id="user-greeting">Welcome</div>
                </div>
                <div style="display:flex; gap:1rem; align-items:center">
                    <button id="theme-toggle" class="btn btn-outline btn-sm" style="width:40px; height:40px; border-radius:50%; padding:0; background:var(--surface-color); border:1px solid var(--glass-border)">🌙</button>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>New Application</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Submit your railway pass request by filling the details below.</p>
                </div>

                <div class="glass-card" style="margin:0; max-width: 700px; padding: 2.5rem; border-radius: var(--radius-lg);">
                    <form id="apply-form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="stu-name" class="form-control" disabled style="background:rgba(0,0,0,0.02); opacity:0.8; border-style:dashed;">
                        </div>
                        
                        <div style="display:flex; gap:1.5rem;">
                            <div class="form-group" style="flex:1;">
                                <label>Student Roll Number</label>
                                <input type="text" id="stu-roll" class="form-control" disabled style="background:rgba(0,0,0,0.02); opacity:0.8; border-style:dashed;">
                            </div>
                            <div class="form-group" style="flex:1;">
                                <label>Academic Branch</label>
                                <input type="text" id="stu-branch" class="form-control" disabled style="background:rgba(0,0,0,0.02); opacity:0.8; border-style:dashed;">
                            </div>
                        </div>

                        <div style="margin: 2rem 0; height: 1px; background: var(--border);"></div>

                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>Departure Station (From)</label>
                                <input type="text" id="from_station" class="form-control" required placeholder="e.g. Borivali">
                            </div>

                            <div class="form-group">
                                <label>Destination Station (To)</label>
                                <input type="text" id="to_station" class="form-control" required placeholder="e.g. Churchgate">
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 1rem;">
                            <label>ID Card Verification</label>
                            <div style="border: 2px dashed var(--border); padding: 2rem; border-radius: var(--radius-md); text-align: center; background: rgba(0,0,0,0.01); transition: var(--transition);" id="drop-zone">
                                <div style="font-size: 2rem; margin-bottom: 0.5rem;">📁</div>
                                <div style="color: var(--text-muted); font-size: 0.85rem;">Click or drag to upload ID card photo</div>
                                <input type="file" id="id-upload" style="display:none;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="apply-btn" style="margin-top: 2rem; height: 50px;">
                            <span id="apply-text">Submit Request</span>
                        </button>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            setupThemeToggle();
            currentUser = checkAuth('student');
            if(!currentUser) return;
            
            document.getElementById('user-greeting').innerText = `Hello, ${currentUser.name}`;
            document.getElementById('stu-name').value = currentUser.name;
            document.getElementById('stu-roll').value = currentUser.roll_no;
            document.getElementById('stu-branch').value = currentUser.branch;

            // Drop-zone Logic
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('id-upload');

            dropZone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const fileName = fileInput.files[0].name;
                    dropZone.innerHTML = `
                        <div style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--success);">✓</div>
                        <div style="font-weight: 600; font-size: 0.9rem;">${fileName}</div>
                        <div style="color: var(--text-muted); font-size: 0.75rem; margin-top:0.25rem;">Click to change file</div>
                    `;
                    dropZone.style.borderColor = 'var(--success)';
                    dropZone.style.background = 'var(--success-bg)';
                }
            });

            // Drag and Drop support
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--primary)';
                dropZone.style.background = 'rgba(37, 99, 235, 0.05)';
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.style.borderColor = 'var(--border)';
                dropZone.style.background = 'rgba(0,0,0,0.01)';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            });
        });

        document.getElementById('apply-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('id-upload');
            if (fileInput.files.length === 0) {
                showToast('Please upload your ID card photo.', 'error');
                return;
            }

            const from_station = document.getElementById('from_station').value;
            const to_station = document.getElementById('to_station').value;
            
            const btnText = document.getElementById('apply-text');
            btnText.innerHTML = '<span class="spinner"></span> Submitting...';
            
            const res = await apiCall('/apply', 'POST', {
                student_id: currentUser.id,
                from_station,
                to_station
            });
            
            btnText.innerHTML = 'Submit Application';
            
            if (res.success) {
                showToast('Application submitted successfully!');
                document.getElementById('apply-form').reset();
                setTimeout(() => window.location.href = 'status.html', 1500);
            } else {
                showToast(res.message, 'error');
            }
        });
    </script>
</body>
</html>
