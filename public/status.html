<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Status</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                🚆 Concession
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                    Dashboard
                </a>
                <a href="apply.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"></path></svg>
                    Apply Now
                </a>
                <a href="status.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Application Status
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border);">
                <button onclick="logout()" class="btn btn-outline btn-sm" style="width: 100%; justify-content: flex-start; gap: 0.5rem; color: var(--error);">
                    <svg style="width:18px; height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
                    Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar glass">
                <div class="user-profile">
                    <div style="font-weight: 600; font-size: 1.1rem;" id="user-greeting">Welcome</div>
                </div>
                <div style="display:flex; gap:1rem; align-items:center">
                    <button id="theme-toggle" class="btn btn-outline btn-sm" style="width:40px; height:40px; border-radius:50%; padding:0; background:var(--surface-color); border:1px solid var(--glass-border)">🌙</button>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Track Applications</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">View the real-time status of your concession requests.</p>
                </div>

                <div class="table-container glass">
                    <table>
                        <thead>
                            <tr>
                                <th>Ref #</th>
                                <th>Travel Route</th>
                                <th>Applied On</th>
                                <th>Current Status</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="status-table-body">
                            <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- QR Code Modal -->
    <div class="qr-modal" id="qrModal">
        <div class="qr-card">
            <h3 style="margin-bottom:0.5rem;">Approved E-Pass</h3>
            <p style="color:var(--text-muted); font-size:0.875rem;">Show this QR during ticket booking</p>
            <div id="qrcode"></div>
            <p id="qr-route" style="font-weight:600; margin: 1rem 0; font-size:1.1rem;"></p>
            <button class="btn btn-outline" onclick="closeQRModal()">Close</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            setupThemeToggle();
            currentUser = checkAuth('student');
            if(!currentUser) return;
            
            document.getElementById('user-greeting').innerText = `Hello, ${currentUser.name}`;
            
            const res = await apiCall(`/applications/${currentUser.id}`);
            const tbody = document.getElementById('status-table-body');
            
            if(res.success && res.applications) {
                if(res.applications.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:3rem;">You haven't applied for a concession yet. <br><br> <a href="apply.html" class="btn btn-primary btn-sm">Apply Now</a></td></tr>`;
                } else {
                    tbody.innerHTML = res.applications.map(app => {
                        let actionBtn = '-';
                        if (app.status === 'Approved') {
                            actionBtn = `<button class="btn btn-primary btn-sm" onclick="showQR('${app.id}', '${app.from_station}', '${app.to_station}')">View QR 🚄</button>`;
                        }
                        return `
                        <tr>
                            <td>#${1000 + app.id}</td>
                            <td>${app.from_station} ➔ ${app.to_station}</td>
                            <td>${new Date(app.date_applied).toLocaleDateString()}</td>
                            <td><span class="badge ${app.status.toLowerCase()}">${app.status}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                        `;
                    }).join('');
                }
            }
        });

        const qrModal = document.getElementById('qrModal');
        let qrGenerator = null;

        function showQR(id, from, to) {
            document.getElementById('qr-route').innerText = `${from} ➔ ${to}`;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            
            // Create QR code
            qrGenerator = new QRCode(qrContainer, {
                text: `Concession ID: ${id}\nStudent: ${currentUser.name}\nRoll: ${currentUser.roll_no}\nRoute: ${from} to ${to}\nStatus: VALID`,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            qrModal.classList.add('active');
        }

        function closeQRModal() {
            qrModal.classList.remove('active');
        }
    </script>
</body>
</html>
